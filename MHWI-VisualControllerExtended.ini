; ============================================================================
;  MHWI-VisualControllerExtended.ini —— 视觉项 ID 返回值控制插件配置
;  与 MHWI-VisualControllerExtended.dll 放在同一目录（游戏 nativePC\plugins\）。
;
;  原理：挂钩游戏内"按 ID 查询布尔开关"的函数（签名扫描定位），
;        对 [RuleN] 命中的 ID 直接返回配置值，不再执行游戏原逻辑；
;        未配置任何规则的 ID 完全透传给原函数。
;  DLL 不包含内置规则；此文件缺失或为空时，所有 ID 都会透传。
;  Rule 编号共 58 个；其中 Rule13–21 注释禁用，实际启用 49 条规则，
;  覆盖 ID 22–25、30–31、36–40、42–50、52–55。
;
;  规则：按文件顺序逐条匹配，同ID下第一条完全命中的规则生效。
;    Id         必填，十进制或 0x 十六进制。
;    WeaponType 武器类型(0..13)，-1=不限。3=太刀 10=虫棍，其余为游戏武器编号。
;    Spirit     练气/档位(0..3)，-1=不限。（对太刀=练气槽等级 0无/1白/2黄/3红）
;    SpiritMin/SpiritMax  练气范围(含)，-1=不限。
;    LmtMin     当前动作 LMT 下限(含)，-1=不限。
;    LmtMax     当前动作 LMT 上限(含)，-1=不限。
;    Demon      鬼人化状态 精确匹配(0=关闭 1=开启)，-1=不限。
;    DemonMin/DemonMax    鬼人化范围(含)，-1=不限。
;    Archdemon  鬼人强化状态 精确匹配(0=关闭 1=开启)，-1=不限。
;    HealthPercentMin   血量百分比下限(含)，-1=不限。
;    HealthPercentMax   血量百分比上限(含)，-1=不限。
;    HealthPercentAbove 血量百分比严格下限(不含)，-1=不限。
;    LatchUntilHealthZero 命中后锁存 Return；血量归零、角色变化或重载配置时复位。
;    Return     命中后返回值：1=true 0=false。
; ============================================================================

[VisualController]
PlayerRoot=0x1450139A0   ; 玩家基址（15.23.00；换版本改这里）
PollMs=60                ; 状态(练气/动作/武器/血量)轮询间隔(ms)
Enabled=1                ; 总开关
IdOffset=4               ; ID 在查询对象中的偏移（默认读取 *(uint16*)(query+4)）
WaitForEarlierHook=1     ; 安装前为其他通用 inline hook 预留加载时间
HookWaitMs=2000          ; 等待时间（0..30000ms）；不需要兼容其他 Hook 时可设为 0
;TargetRva=0x0           ; 已知目标函数 RVA 时直接填，跳过签名扫描
; Signature 是受支持游戏版本中的函数定位字节，必须在模块内唯一命中。
; 指令解析和 trampoline 由 MinHook 完成，不要求签名长度等于覆盖长度。
;Signature=48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 57 41 56 41 57 48 83 EC 20 45 0F B7 50 04
ChatEcho=1               ; 游戏内系统消息回显
ChatCommands=1           ; /vc 聊天框指令

[Hotkeys]                ; 17=Ctrl；数字是 Windows 虚拟键码
ModifierKey=17
ReloadKey=116            ; Ctrl+F5 重载 ini
ToggleKey=120            ; Ctrl+F9 开关

